<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sessione</title>
<style>
/* ============================================================
   COMPITO DELLA FIGURA (voodoo doll task)
   Misura comportamentale di aggressivita' diretta a un bersaglio.
   Il partecipante inserisce da 0 a 51 spilli.
   Registra: numero di spilli, zona, coordinate, ordine, tempi.
   PARAMETRI URL: ?pid=  ?target=  ?max=
   Il termine "voodoo" non compare mai a schermo.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:#2b2620;
  overflow:hidden;
  background:
    repeating-linear-gradient(177deg,
      rgba(110,72,30,.055) 0px, rgba(110,72,30,.055) 1px,
      transparent 1px, transparent 5px),
    repeating-linear-gradient(177deg,
      #e2caa1 0px, #d9bf93 24px, #e9d7b2 50px, #d4b98d 82px, #e2caa1 118px),
    #ddc59b;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:
    radial-gradient(ellipse 220px 90px at 18% 26%, rgba(120,78,32,.16), transparent 70%),
    radial-gradient(ellipse 150px 70px at 82% 68%, rgba(120,78,32,.13), transparent 70%),
    radial-gradient(ellipse 110px 55px at 62% 12%, rgba(120,78,32,.10), transparent 70%);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%, transparent 38%, rgba(58,36,10,.32) 100%);
}
.wrap{
  height:100%; display:flex; flex-direction:column; align-items:center;
  padding:clamp(8px,1.8vh,20px) 16px; position:relative; z-index:2;
}
.consegna{
  max-width:700px; text-align:center;
  background:rgba(255,252,245,.93);
  border:1px solid rgba(80,60,30,.28);
  border-radius:10px; padding:clamp(9px,1.5vh,15px) 20px;
  box-shadow:0 3px 16px rgba(60,40,15,.22); flex-shrink:0;
}
.consegna h1{ font-size:clamp(.95rem,2.2vh,1.18rem); font-weight:600; margin-bottom:5px; }
.consegna p{ font-size:clamp(.8rem,1.8vh,.95rem); line-height:1.5; color:#4a4238; }
.consegna strong{ color:#2b2620; }
.scena{
  flex:1; min-height:0; width:100%;
  display:flex; align-items:center; justify-content:center;
  margin:clamp(4px,1.2vh,12px) 0;
}
svg#figura{
  height:100%; max-height:100%; width:auto;
  cursor:crosshair; touch-action:manipulation;
}
svg#figura.piena{ cursor:not-allowed; }
.barra{
  flex-shrink:0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  justify-content:center; background:rgba(255,252,245,.94);
  border:1px solid rgba(80,60,30,.28); border-radius:10px;
  padding:10px 16px; box-shadow:0 3px 16px rgba(60,40,15,.22);
}
.contatore{ font-size:clamp(.85rem,2vh,1rem); font-variant-numeric:tabular-nums; }
.contatore b{ font-size:1.3em; }
.btn{
  font:inherit; font-size:clamp(.8rem,1.9vh,.95rem);
  border-radius:8px; padding:9px 18px; cursor:pointer;
  border:1px solid transparent; transition:filter .15s, transform .06s;
}
.btn:active:not(:disabled){ transform:translateY(1px); }
.btn-sec{ background:#efe7d8; border-color:rgba(80,60,30,.35); color:#4a4238; }
.btn-sec:disabled{ opacity:.4; cursor:default; }
.btn-pri{ background:#3f6b46; color:#fff; font-weight:600; box-shadow:0 2px 8px rgba(40,70,45,.35); }
.btn:hover:not(:disabled){ filter:brightness(1.06); }
.fine{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; background:rgba(35,28,18,.78);
}
.fine.on{ display:flex; }
.fine .box{
  background:#fffdf7; border-radius:14px; padding:34px 40px;
  text-align:center; max-width:460px; box-shadow:0 12px 40px rgba(0,0,0,.4);
}
.fine h2{ font-size:1.2rem; margin-bottom:10px; }
.fine p{ color:#5a5145; line-height:1.55; font-size:.95rem; }
</style>
</head>
<body>

<div class="wrap">

  <div class="consegna">
    <h1>Prima di proseguire</h1>
    <p id="istruzioni"></p>
  </div>

  <div class="scena">
    <svg id="figura" viewBox="0 0 460 680" xmlns="http://www.w3.org/2000/svg" aria-label="Figura">
      <defs>
        <!-- trama di juta -->
        <pattern id="juta" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect width="6" height="6" fill="none"/>
          <path d="M0 1.5 H6 M0 4.5 H6" stroke="rgba(45,36,24,.16)" stroke-width="1"/>
          <path d="M1.5 0 V6 M4.5 0 V6" stroke="rgba(255,245,225,.13)" stroke-width="1"/>
        </pattern>
        <filter id="ombraDoll" x="-30%" y="-20%" width="170%" height="150%">
          <feDropShadow dx="14" dy="20" stdDeviation="12" flood-color="#4a2f0d" flood-opacity=".42"/>
        </filter>
        <linearGradient id="gArto" x1="0" y1="0" x2="0.15" y2="1">
          <stop offset="0%" stop-color="#7a7264"/>
          <stop offset="45%" stop-color="#635b50"/>
          <stop offset="100%" stop-color="#453f37"/>
        </linearGradient>
        <linearGradient id="gTorso" x1="0.15" y1="0" x2="0.95" y2="1">
          <stop offset="0%" stop-color="#a89c8a"/>
          <stop offset="55%" stop-color="#978b7b"/>
          <stop offset="100%" stop-color="#7b7062"/>
        </linearGradient>
        <radialGradient id="gTesta" cx="0.36" cy="0.3" r="0.85">
          <stop offset="0%" stop-color="#b0a493"/>
          <stop offset="62%" stop-color="#9a8e7e"/>
          <stop offset="100%" stop-color="#7d7264"/>
        </radialGradient>
        <linearGradient id="gCappello" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#575147"/>
          <stop offset="100%" stop-color="#39342d"/>
        </linearGradient>
      </defs>

      <g id="doll" transform="rotate(-5 230 340)" filter="url(#ombraDoll)">

        <!-- ---------- gambe ---------- -->
        <g class="corpo" data-zona="gamba sinistra">
          <rect x="150" y="452" width="56" height="200" rx="28" fill="url(#gArto)"/>
          <rect x="150" y="452" width="56" height="200" rx="28" fill="url(#juta)"/>
          <rect x="150" y="452" width="56" height="200" rx="28" fill="none" stroke="#332e28" stroke-width="1.6" opacity=".55"/>
          <path d="M160 476 H196" stroke="#2f2a23" stroke-width="2.4" stroke-dasharray="5 6" stroke-linecap="round" opacity=".6"/>
        </g>
        <g class="corpo" data-zona="gamba destra">
          <rect x="252" y="452" width="56" height="200" rx="28" fill="url(#gArto)"/>
          <rect x="252" y="452" width="56" height="200" rx="28" fill="url(#juta)"/>
          <rect x="252" y="452" width="56" height="200" rx="28" fill="none" stroke="#332e28" stroke-width="1.6" opacity=".55"/>
          <path d="M262 476 H298" stroke="#2f2a23" stroke-width="2.4" stroke-dasharray="5 6" stroke-linecap="round" opacity=".6"/>
        </g>

        <!-- ---------- braccia ---------- -->
        <g class="corpo" data-zona="braccio sinistro" transform="rotate(-7 130 318)">
          <rect x="34" y="292" width="164" height="52" rx="26" fill="url(#gArto)"/>
          <rect x="34" y="292" width="164" height="52" rx="26" fill="url(#juta)"/>
          <rect x="34" y="292" width="164" height="52" rx="26" fill="none" stroke="#332e28" stroke-width="1.6" opacity=".55"/>
          <path d="M70 302 V334" stroke="#2f2a23" stroke-width="2.4" stroke-dasharray="5 6" stroke-linecap="round" opacity=".6"/>
        </g>
        <g class="corpo" data-zona="braccio destro" transform="rotate(7 330 318)">
          <rect x="262" y="292" width="164" height="52" rx="26" fill="url(#gArto)"/>
          <rect x="262" y="292" width="164" height="52" rx="26" fill="url(#juta)"/>
          <rect x="262" y="292" width="164" height="52" rx="26" fill="none" stroke="#332e28" stroke-width="1.6" opacity=".55"/>
          <path d="M390 302 V334" stroke="#2f2a23" stroke-width="2.4" stroke-dasharray="5 6" stroke-linecap="round" opacity=".6"/>
        </g>

        <!-- ---------- torso ---------- -->
        <g class="corpo" data-zona="torso">
          <path id="pTorso" d="M229 236
                   C 290 236, 320 276, 320 336
                   C 320 412, 312 452, 292 470
                   C 274 486, 184 486, 166 470
                   C 146 452, 138 412, 138 336
                   C 138 276, 168 236, 229 236 Z"
                fill="url(#gTorso)"/>
          <path d="M229 236
                   C 290 236, 320 276, 320 336
                   C 320 412, 312 452, 292 470
                   C 274 486, 184 486, 166 470
                   C 146 452, 138 412, 138 336
                   C 138 276, 168 236, 229 236 Z"
                fill="url(#juta)"/>
          <path d="M229 236
                   C 290 236, 320 276, 320 336
                   C 320 412, 312 452, 292 470
                   C 274 486, 184 486, 166 470
                   C 146 452, 138 412, 138 336
                   C 138 276, 168 236, 229 236 Z"
                fill="none" stroke="#332e28" stroke-width="1.8" opacity=".5"/>
          <!-- cucitura centrale -->
          <path d="M229 256 L229 352" stroke="#2f2a23" stroke-width="2.6"
                stroke-dasharray="8 8" stroke-linecap="round" opacity=".62"/>
          <!-- toppa del ventre -->
          <ellipse cx="224" cy="414" rx="58" ry="50" fill="#b6ad9c"/>
          <ellipse cx="224" cy="414" rx="58" ry="50" fill="url(#juta)"/>
          <ellipse cx="224" cy="414" rx="58" ry="50" fill="none"
                   stroke="#2f2a23" stroke-width="2.4" stroke-dasharray="6 8" opacity=".62"/>
          <!-- cuore -->
          <path d="M272 322
                   c -7 -14, -29 -14, -29 4
                   c 0 15, 20 25, 29 34
                   c 9 -9, 29 -19, 29 -34
                   c 0 -18, -22 -18, -29 -4 Z"
                fill="#b02730"/>
          <path d="M272 322
                   c -7 -14, -29 -14, -29 4
                   c 0 15, 20 25, 29 34
                   c 9 -9, 29 -19, 29 -34
                   c 0 -18, -22 -18, -29 -4 Z"
                fill="url(#juta)" opacity=".7"/>
          <path d="M272 322
                   c -7 -14, -29 -14, -29 4
                   c 0 15, 20 25, 29 34
                   c 9 -9, 29 -19, 29 -34
                   c 0 -18, -22 -18, -29 -4 Z"
                fill="none" stroke="#6f1016" stroke-width="1.8" opacity=".8"/>
        </g>

        <!-- ---------- testa ---------- -->
        <g class="corpo" data-zona="testa">
          <circle cx="230" cy="156" r="84" fill="url(#gTesta)"/>
          <circle cx="230" cy="156" r="84" fill="url(#juta)"/>
          <circle cx="230" cy="156" r="84" fill="none" stroke="#332e28" stroke-width="1.8" opacity=".5"/>
          <!-- occhio sinistro: bottone rosso con croce -->
          <circle cx="196" cy="144" r="25" fill="#b8272d"/>
          <circle cx="196" cy="144" r="25" fill="url(#juta)" opacity=".6"/>
          <circle cx="196" cy="144" r="25" fill="none" stroke="#71121a" stroke-width="2" opacity=".85"/>
          <path d="M185 133 L207 155 M207 133 L185 155"
                stroke="#221d18" stroke-width="4" stroke-linecap="round"/>
          <!-- occhio destro: bottone scuro -->
          <circle cx="266" cy="140" r="24" fill="#222a3a"/>
          <circle cx="266" cy="140" r="24" fill="none" stroke="#0f131c" stroke-width="2" opacity=".85"/>
          <circle cx="258" cy="132" r="6" fill="#4a566f" opacity=".75"/>
          <!-- bocca cucita -->
          <path d="M186 202 L278 199" stroke="#2f2a23" stroke-width="3" stroke-linecap="round"/>
          <path d="M196 192 L193 212 M216 191 L213 211 M236 190 L233 210 M256 189 L253 209 M274 188 L271 208"
                stroke="#2f2a23" stroke-width="2.8" stroke-linecap="round"/>
        </g>

        <!-- ---------- cappello ---------- -->
        <g class="corpo" data-zona="cappello">
          <ellipse cx="222" cy="82" rx="92" ry="38" fill="url(#gCappello)" transform="rotate(-11 222 82)"/>
          <ellipse cx="222" cy="82" rx="92" ry="38" fill="url(#juta)" transform="rotate(-11 222 82)" opacity=".8"/>
          <ellipse cx="230" cy="66" rx="58" ry="27" fill="#5f594f" transform="rotate(-11 230 66)" opacity=".9"/>
          <ellipse cx="222" cy="82" rx="92" ry="38" fill="none" stroke="#26221c" stroke-width="1.8"
                   transform="rotate(-11 222 82)" opacity=".6"/>
        </g>

      </g>

      <g id="spilli"></g>
    </svg>
  </div>

  <div class="barra">
    <div class="contatore">Spilli inseriti: <b id="conta">0</b> <span id="massimo"></span></div>
    <button class="btn btn-sec" id="annulla" disabled>Togli l'ultimo</button>
    <button class="btn btn-pri" id="fatto">Ho finito</button>
  </div>

</div>

<div class="fine" id="schermataFine">
  <div class="box">
    <h2>Grazie.</h2>
    <p>Vai alla pagina successiva per proseguire con lo studio.</p>
  </div>
</div>

<script>
"use strict";

var P = { pid:"", target:"", max:51 };
try{
  var q = new URLSearchParams(location.search);
  P.pid    = q.get("pid") || "";
  P.target = q.get("target") || "";
  var m = parseInt(q.get("max"), 10);
  if(!isNaN(m) && m > 0){ P.max = m; }
}catch(e){}

var chi = P.target ? ("<strong>" + P.target + "</strong>") : "uno degli altri giocatori";
document.getElementById("istruzioni").innerHTML =
  "La figura qui sotto rappresenta " + chi + ", con cui hai giocato poco fa. " +
  "Se ti va, puoi scaricare su questa figura la tensione o il fastidio che hai provato " +
  "durante il gioco, <strong>inserendo degli spilli</strong>: fai clic sul punto della figura " +
  "in cui vuoi metterli. Puoi inserirne quanti vuoi, da nessuno fino a " + P.max +
  ". Non c’è una risposta giusta. Quando hai finito, premi «Ho finito».";
document.getElementById("massimo").textContent = "su " + P.max;

var svg      = document.getElementById("figura");
var strato   = document.getElementById("spilli");
var elConta  = document.getElementById("conta");
var btnUndo  = document.getElementById("annulla");
var btnFatto = document.getElementById("fatto");

var spilli = [];
var avvio  = performance.now();
var chiuso = false;
var COLORI = ["#c62828", "#1565c0", "#2e7d32", "#7d5a2b", "#efefef", "#e0a800"];
var NS = "http://www.w3.org/2000/svg";

function creaSpillo(x, y){
  var g = document.createElementNS(NS, "g");
  var ang = (-72 + Math.random() * 58) * Math.PI / 180;
  var len = 40 + Math.random() * 20;
  var x2 = x + Math.cos(ang) * len;
  var y2 = y + Math.sin(ang) * len;
  var colore = COLORI[Math.floor(Math.random() * COLORI.length)];

  var ombra = document.createElementNS(NS, "line");
  ombra.setAttribute("x1", x + 3); ombra.setAttribute("y1", y + 4);
  ombra.setAttribute("x2", x2 + 3); ombra.setAttribute("y2", y2 + 4);
  ombra.setAttribute("stroke", "rgba(35,22,8,.30)");
  ombra.setAttribute("stroke-width", "3.4");
  ombra.setAttribute("stroke-linecap", "round");
  g.appendChild(ombra);

  var ago = document.createElementNS(NS, "line");
  ago.setAttribute("x1", x); ago.setAttribute("y1", y);
  ago.setAttribute("x2", x2); ago.setAttribute("y2", y2);
  ago.setAttribute("stroke", "#b9bfc6");
  ago.setAttribute("stroke-width", "2.8");
  ago.setAttribute("stroke-linecap", "round");
  g.appendChild(ago);

  var luce = document.createElementNS(NS, "line");
  luce.setAttribute("x1", x); luce.setAttribute("y1", y);
  luce.setAttribute("x2", x2); luce.setAttribute("y2", y2);
  luce.setAttribute("stroke", "#ffffff");
  luce.setAttribute("stroke-width", "1");
  luce.setAttribute("stroke-linecap", "round");
  luce.setAttribute("opacity", ".7");
  g.appendChild(luce);

  var ombraTesta = document.createElementNS(NS, "circle");
  ombraTesta.setAttribute("cx", x2 + 2.5); ombraTesta.setAttribute("cy", y2 + 3);
  ombraTesta.setAttribute("r", "7.5");
  ombraTesta.setAttribute("fill", "rgba(35,22,8,.28)");
  g.appendChild(ombraTesta);

  var testa = document.createElementNS(NS, "circle");
  testa.setAttribute("cx", x2); testa.setAttribute("cy", y2);
  testa.setAttribute("r", "7.5");
  testa.setAttribute("fill", colore);
  g.appendChild(testa);

  var brillo = document.createElementNS(NS, "circle");
  brillo.setAttribute("cx", x2 - 2.4); brillo.setAttribute("cy", y2 - 2.8);
  brillo.setAttribute("r", "2.4");
  brillo.setAttribute("fill", "#ffffff");
  brillo.setAttribute("opacity", ".6");
  g.appendChild(brillo);

  strato.appendChild(g);
  return g;
}

function puntoSvg(evt){
  var r = svg.getBoundingClientRect();
  var vb = svg.viewBox.baseVal;
  var scala = Math.min(r.width / vb.width, r.height / vb.height);
  var offX = (r.width  - vb.width  * scala) / 2;
  var offY = (r.height - vb.height * scala) / 2;
  return {
    x: (evt.clientX - r.left - offX) / scala,
    y: (evt.clientY - r.top  - offY) / scala
  };
}

svg.addEventListener("click", function(evt){
  if(chiuso) { return; }
  if(spilli.length >= P.max) { return; }
  var parte = evt.target.closest ? evt.target.closest("[data-zona]") : null;
  if(!parte) { return; }
  var p = puntoSvg(evt);
  var nodo = creaSpillo(p.x, p.y);
  spilli.push({
    x: Math.round(p.x * 10) / 10,
    y: Math.round(p.y * 10) / 10,
    zona: parte.getAttribute("data-zona"),
    ms: Math.round(performance.now() - avvio),
    nodo: nodo
  });
  aggiorna();
});

btnUndo.addEventListener("click", function(){
  if(chiuso || !spilli.length) { return; }
  var ultimo = spilli.pop();
  if(ultimo.nodo && ultimo.nodo.parentNode) { ultimo.nodo.parentNode.removeChild(ultimo.nodo); }
  aggiorna();
});

function aggiorna(){
  elConta.textContent = spilli.length;
  btnUndo.disabled = spilli.length === 0;
  if(spilli.length >= P.max){ svg.classList.add("piena"); } else { svg.classList.remove("piena"); }
}

btnFatto.addEventListener("click", function(){
  if(chiuso) { return; }
  chiuso = true;
  btnFatto.disabled = true;
  btnUndo.disabled = true;

  var perZona = {};
  spilli.forEach(function(s){ perZona[s.zona] = (perZona[s.zona] || 0) + 1; });

  var dati = {
    source: "figura",
    pid: P.pid,
    target: P.target,
    spilli: spilli.length,
    per_zona: perZona,
    posizioni: spilli.map(function(s, i){
      return { n: i + 1, x: s.x, y: s.y, zona: s.zona, ms: s.ms };
    }),
    ms_totale: Math.round(performance.now() - avvio)
  };

  try{ parent.postMessage(dati, "*"); }catch(e){}

  document.getElementById("schermataFine").classList.add("on");
});
</script>
</body>
</html>
